<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadMind - AI Driven GitHub Optimizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styling */
        .navbar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 5%;
        }

        .navbar-brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand i {
            background: -webkit-linear-gradient(#00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-left: 10px;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .nav-btn-primary {
            background: -webkit-linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
        }

        .nav-btn-primary:hover {
            background: -webkit-linear-gradient(45deg, #0072ff, #00c6ff);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
        }

        /* Hero Section */
        .hero-section {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .text-gradient {
            background: -webkit-linear-gradient(#00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #b0bec5;
            font-weight: 300;
            margin-bottom: 40px;
        }

        /* Modals for Login/Signup (Simulated via Glassmorphism Cards) */
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            filter: blur(80px);
            opacity: 0.5;
            border-radius: 50%;
        }

        .shape-1 {
            background: #00c6ff;
            width: 400px;
            height: 400px;
            top: 10%;
            left: -100px;
        }

        .shape-2 {
            background: #0072ff;
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -100px;
        }
    </style>
</head>
<body>

    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-brain"></i> ReadMind
            </a>
            <div class="d-flex ms-auto">
                <a href="#" class="nav-btn d-none d-sm-inline-block" onclick="handleAuth(event, 'Login')">Log in</a>
                <a href="#" class="nav-btn nav-btn-primary" onclick="handleAuth(event, 'Sign up')">Sign up</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Supercharge your GitHub with <span class="text-gradient">AI Power</span></h1>
            <p class="hero-subtitle">ReadMind automatically generates stunning READMEs, optimizes your profile, and provides repository insights to make you stand out as a top-tier developer.</p>
            
            <div>
                <a href="#" class="nav-btn nav-btn-primary px-4 py-3 fs-5 me-3" onclick="handleAuth(event, 'Get Started')">
                    Get Started for Free
                </a>
                <a href="https://github.com/UmerDevHub/ReadMind" target="_blank" class="nav-btn px-4 py-3 fs-5">
                    <i class="fa-brands fa-github me-2"></i> View on GitHub
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleAuth(e, actionType) {
            e.preventDefault();
            // This will later show a modal or redirect to the login/oauth page
            alert(`${actionType} clicked! In a full implementation, this will open a sign-in modal or redirect to GitHub OAuth.`);
        }
    </script>
</body>
</html>
